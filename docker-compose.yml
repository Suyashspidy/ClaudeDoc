version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER=redis://redis:6379/0
      - CELERY_BACKEND=redis://redis:6379/1
    env_file:
      - .env
    volumes:
      - uploads:/app/uploads
      - reports:/app/reports
      - cache:/app/cache
    depends_on:
      redis:
        condition: service_healthy
    devices:
      - /dev/kfd:/dev/kfd       # AMD GPU compute
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER=redis://redis:6379/0
      - CELERY_BACKEND=redis://redis:6379/1
    env_file:
      - .env
    volumes:
      - uploads:/app/uploads
      - reports:/app/reports
      - cache:/app/cache
    depends_on:
      redis:
        condition: service_healthy
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render
    restart: unless-stopped
    deploy:
      replicas: 2  # Scale workers for parallel document processing

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "8501:8501"
    environment:
      - API_BASE=http://api:8000/api/v1
    depends_on:
      - api
    restart: unless-stopped

volumes:
  redis_data:
  uploads:
  reports:
  cache:
